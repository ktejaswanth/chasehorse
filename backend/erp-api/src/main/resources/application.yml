spring:
  application:
    name: chasehorse-erp-api
  datasource:
    # Runtime connection for the API. Use a DEDICATED role (see database/scripts/create_api_role.sql).
    # Supabase pooler in transaction mode: keep prepareThreshold=0.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chasehorse?prepareThreshold=0}
    username: ${DATABASE_USER:chasehorse_api}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    # OFF by default so starting the API can never migrate a shared/production DB by accident.
    # Run migrations deliberately (CI job / operator) with FLYWAY_ENABLED=true and the owner credentials.
    enabled: ${FLYWAY_ENABLED:false}
    url: ${FLYWAY_URL:${DATABASE_URL:}}
    user: ${FLYWAY_USER:${DATABASE_USER:}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:}}
    schemas: app
    default-schema: app
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

chasehorse:
  supabase:
    url: ${SUPABASE_URL:}                      # https://<ref>.supabase.co
    jwt-secret: ${SUPABASE_JWT_SECRET:}        # only for legacy HS256 projects; leave empty for JWKS (asymmetric) projects
    service-key: ${SUPABASE_SERVICE_KEY:}      # SERVER-SIDE ONLY. Never sent to a client, never logged.
    evidence-bucket: task-evidence
    signed-url-seconds: 600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    max-page-size: 200

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    com.chasehorse: INFO
    org.springframework.security: WARN
